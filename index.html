<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>How Else Could I Say It?</title>
  <meta name="description" content="A playful card game about humor and everyday expression — a design research toolkit.">
  <meta name="theme-color" content="#FBF3E4">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='14' y='6' width='72' height='88' rx='16' fill='%23688B59'/%3E%3Ccircle cx='50' cy='50' r='22' fill='%2370CEAA'/%3E%3Ctext x='50' y='62' font-size='34' font-weight='900' text-anchor='middle' fill='%232F3B2C' font-family='Arial'%3E%3F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="deco" aria-hidden="true"></canvas>

  <header class="topbar">
    <button class="logo" data-action="home" aria-label="Home">
      <span class="logo-mark" aria-hidden="true"></span><span class="logo-text">How Else Could I Say It?</span>
    </button>
    <nav class="progress" id="progress" aria-label="Progress"></nav>
    <div class="top-right">
      <span class="autosave" id="autosave"></span>
      <div class="lang" role="group" aria-label="Language">
        <button data-action="lang" data-lang="en">EN</button>
        <button data-action="lang" data-lang="zh">中</button>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <div id="toasts" aria-live="polite"></div>
  <div id="modal" role="dialog" aria-modal="true"></div>

  <noscript><p style="padding:24px;text-align:center">Please enable JavaScript to play. / 请开启 JavaScript。</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/deco.js"></script>
  <script src="js/resultcard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
